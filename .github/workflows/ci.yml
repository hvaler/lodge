name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default. A job that needs more asks for it itself.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: typecheck, test, build
    # Pinned, not `ubuntu-latest`. That label migrates to Ubuntu 26 from 19 October 2026 — two days
    # before this project is submitted and one day before the repository is frozen. `ubuntu-latest`
    # resolved to exactly this image on 22 September, so pinning changes nothing today and removes a
    # way for the build to break on a date nobody chose. Worth revisiting after the submission.
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      # Actions are pinned by commit SHA, not by tag: a tag can be moved, and this repository is
      # public and meant to be adopted. The comment records which release each SHA is.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # The pinned runtime. Read from the file so there is one place to change it.
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Includes the contract tests derived from docs/use-cases.md and the latency measurement
      # against the 500 ms Alexa+ budget. The runbook asks for both on every build; this is where
      # "every build" becomes true.
      - name: Test
        run: npm test

      # The same suite on the other side of the date line. iCalendar all-day dates are parsed as
      # local midnight in the *process* zone, so a container in Dublin and one in Auckland used to
      # disagree about when a deadline falls. Running here is what stops that regressing.
      - name: Test under a distant time zone
        run: npm test
        env:
          TZ: Pacific/Auckland

      # Separate because it invokes esbuild to bundle the function, which takes about twenty
      # seconds — too slow to live in the loop somebody runs after every edit, and too important to
      # only run before a deploy. It asserts the CloudFormation, not the constructs: the failure
      # mode is a permission that was right in the pull request and wrong in the account.
      - name: Test the deployment stack
        run: npm run test:infra

      - name: Build
        run: npm run build

  # A separate job, in parallel: it shares no steps with the one above and it is the slowest thing
  # here. Nothing else catches a broken image, and the deployment target an institution actually
  # uses is this one — between M2 and M5 it went unbuilt while five dependencies and three source
  # directories were added to the project.
  container:
    name: the container builds and answers
    runs-on: ubuntu-24.04 # pinned for the reason given above
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the image
        run: docker build -t lodge:ci .

      # Distroless has no shell, so there is nothing to exec into and poke at. The only honest
      # check is to run it and ask it a question, which is also the only check that matters.
      - name: Run it
        run: |
          docker run -d --name lodge -p 3000:3000 lodge:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/health >/dev/null && exit 0
            sleep 1
          done
          echo "it never became healthy"
          exit 1

      - name: It knows what it is serving
        run: curl -sf http://localhost:3000/health | tee /dev/stderr | grep -q 'Universidad de San Telmo'

      - name: It answers a tool call
        run: |
          curl -sf -X POST http://localhost:3000/mcp \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            -H 'mcp-protocol-version: 2025-11-25' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"campus.wayfind","arguments":{"to":"FAR-104"}}}' \
            | tee /dev/stderr | grep -q 'El Faro'

      - name: Say what it logged, whatever happened
        if: always()
        run: docker logs lodge || true
